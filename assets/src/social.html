<!-- GitHub social preview (assets/social.png, 1280×640). Rendered by make_gif.py; upload it in Settings → Social preview.

<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }

  h1 { position: absolute; left: 80px; top: 96px; font-family: "FZHanSongTiS", "Songti SC", serif; font-weight: 700;

  .name { position: absolute; right: 82px; top: 122px; text-align: right; font-size: 26px; color: #8A867D; line-height: 1.45; }

  .row { position: absolute; left: 80px; right: 80px; top: 340px; display: flex; gap: 22px; }
  .card { flex: 1; background: #FBFAF8; border-radius: 26px; padding: 24px 26px 26px; box-shadow: 0 14px 36px rgba(58,51,38,.13); }

  .card__t { margin-top: 12px; font-size: 33px; font-weight: 700; line-height: 1.25; }
